services:
  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 3005
      ENV: ${ENV:-development}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a random secret of at least 32 bytes}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      MONO_PUBLIC_KEY: ${MONO_PUBLIC_KEY:-}
      MONO_SECRET_KEY: ${MONO_SECRET_KEY:-}
      MONO_BASE_URL: ${MONO_BASE_URL:-https://api.withmono.com/v2}
      MONO_CALLBACK_URL: ${MONO_CALLBACK_URL:-}
      MONO_MOBILE_REDIRECT_URL: ${MONO_MOBILE_REDIRECT_URL:-}
      MONO_WEB_REDIRECT_URL: ${MONO_WEB_REDIRECT_URL:-}
      MONO_ALLOWED_REDIRECT_URLS: ${MONO_ALLOWED_REDIRECT_URLS:-}
      MONO_WEBHOOK_SECRET: ${MONO_WEBHOOK_SECRET:-}
      MONO_TIMEOUT_SECONDS: ${MONO_TIMEOUT_SECONDS:-30}
      MONO_DEBUG_LOGGING: ${MONO_DEBUG_LOGGING:-false}
      DATABASE_URL: postgres://trackfund:trackfund@postgres:5432/trackfund?sslmode=disable
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      OPERATIONS_TOKEN: ${OPERATIONS_TOKEN:-}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
    ports:
      - "3005:3005"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: trackfund
      POSTGRES_USER: trackfund
      POSTGRES_PASSWORD: trackfund
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackfund -d trackfund"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
