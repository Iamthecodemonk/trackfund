services:
  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 3005
      DATABASE_URL: postgres://trackfund:trackfund@postgres:5432/trackfund?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
    ports:
      - "3005:3005"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: trackfund
      POSTGRES_USER: trackfund
      POSTGRES_PASSWORD: trackfund
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackfund -d trackfund"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
